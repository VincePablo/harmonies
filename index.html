<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Harmonies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* Layout: table de jeu — colonne gauche = offre commune (jetons + animaux), colonne droite = plateau du joueur actif */
:root{
  --bg:#e9eee6; --panel:#f7f9f4; --ink:#1f2a22; --muted:#5c6a5f; --line:#c9d3c6;
  --accent:#2f6d5c; --accent-ink:#ffffff; --cell:#dbe3d5; --cell-line:#b8c4b3; --hi:#e0a32e; --danger:#a8392c;
  --t-blue:#3f86c4; --t-blue-d:#2a5f8f; --t-grey:#98a0a6; --t-grey-d:#646c72; --t-brown:#8a5a36; --t-brown-d:#5e3c22;
  --t-green:#54a043; --t-green-d:#356e29; --t-yellow:#e7bd3d; --t-yellow-d:#a8841e; --t-red:#cc4a3d; --t-red-d:#8e2d24;
  --t-any:#d6d0c4; --t-any-d:#a39c8e;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,360px) minmax(0,1fr);
  grid-template-areas:"top top" "bar bar" "offer play" "animals play"; align-items:start}
.top{grid-area:top;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
.top h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.02em}
.top h1 span{color:var(--accent)}
.meta{color:var(--muted);font-size:13px;display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.bar{grid-area:bar;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px 6px 8px;font-weight:600;font-size:14px}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.chip.cur .dot{background:var(--accent)}
.chip.view{border-color:var(--ink)}
.chip b{font-variant-numeric:tabular-nums;font-family:var(--f-display)}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 6px}
.prow{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}
.prow .seg button{padding:6px 11px;font-size:13px;background:var(--panel)}
.prow .seg button.on{background:var(--accent)}
.prow input{background:var(--panel)}
.thinking{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
@media (prefers-reduced-motion:no-preference){ .thinking{animation:pulse 1s ease-in-out infinite} @keyframes pulse{50%{opacity:.25}} }
.offer{grid-area:offer}.animals{grid-area:animals}.play{grid-area:play;display:grid;gap:16px;min-width:0}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 4px;display:flex;justify-content:center;min-height:56px}
.slot:not([disabled]):hover{border-color:var(--accent)}
.slot[disabled]{cursor:default}
.slot svg{width:84px;height:36px}
.guide{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.guide p{margin:0;font-weight:600;max-width:60ch}
.guide .who{font-family:var(--f-display);font-weight:700;color:var(--accent)}
.hand{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.htok{border:2px solid transparent;background:transparent;border-radius:50%;padding:3px;line-height:0}
.htok.sel{border-color:var(--hi)}
.htok svg{width:40px;height:40px}
.boardbox{display:flex;justify-content:center}
.boardbox svg{width:100%;max-width:560px;height:auto;touch-action:manipulation}
.cell{fill:var(--cell);stroke:var(--cell-line);stroke-width:.04}
.cell.legal{fill:color-mix(in srgb,var(--hi) 28%,var(--cell));stroke:var(--hi);stroke-width:.07;cursor:pointer}
.cell.target{fill:color-mix(in srgb,var(--accent) 30%,var(--cell));stroke:var(--accent);stroke-width:.08;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.card.ready::after{content:"Prêt";position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 7px}
.card.empty{display:grid;place-items:center;color:var(--muted);font-size:13px;min-height:150px;border-style:dashed}
.card[disabled]{cursor:default}
.cname{font-family:var(--f-display);font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}
.cname i{width:10px;height:10px;border-radius:2px;display:inline-block}
.card svg{width:100%;height:68px}
.card svg.art{height:auto;aspect-ratio:100/70;max-width:100%;display:block;border-radius:6px;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.card .cname{font-family:"IM Fell English", Georgia, serif;font-weight:400;font-size:18px}
.card .lat{font-family:"IM Fell English", Georgia, serif;font-style:italic;font-size:12px;color:var(--muted);margin-top:-6px}
.track{display:flex;gap:4px;flex-wrap:wrap}
.track span{min-width:28px;height:26px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:12px;border:1px solid var(--line);font-variant-numeric:tabular-nums;background:var(--panel)}
.track span.cube{color:transparent;position:relative}
.track span.cube::before{content:"";position:absolute;inset:5px 7px;border-radius:3px;background:var(--hue);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.track span.got{border-color:var(--accent);color:var(--accent)}
.score table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.score td{padding:5px 0;border-bottom:1px solid var(--line)}
.score td:last-child{text-align:right;font-weight:700}
.score tr.tot td{border-bottom:0;font-family:var(--f-display);font-size:20px;padding-top:8px}
.done{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.done span{border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
.modal{z-index:40!important;position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(640px,100%);max-height:100%;overflow:auto;display:grid;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.sheet h2{font-size:26px}
.sheet h3{font-size:16px;margin-top:4px}
.sheet p,.sheet li{max-width:65ch;margin:0}
.sheet ul{margin:0;padding-left:18px;display:grid;gap:4px}
.field{display:grid;gap:6px}
.field input{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 14px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rtab{width:100%;border-collapse:collapse;font-size:14px}
.rtab td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.dtab{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.dtab th{text-align:left;font-family:var(--f-display);font-size:15px;padding:12px 0 4px;border-bottom:2px solid var(--line)}
.dtab th:last-child{text-align:right}
.dtab td{padding:4px 0;border-bottom:1px solid var(--line);vertical-align:top}
.dtab td:last-child{text-align:right;font-weight:700;padding-left:12px;white-space:nowrap}
.dtab td.z{color:var(--muted)}
.dtab .why{display:block;font-size:12px;color:var(--muted)}
.dtab tr.tot td{border-bottom:0;font-family:var(--f-display);font-size:20px;padding-top:10px}
.rmap{display:flex;justify-content:center;margin:6px 0 2px}
.rmap svg{width:100%;max-width:300px;height:auto}
.rmap .pth{fill:none;stroke:var(--hi);stroke-width:.14}
.rmap text{font-family:var(--f-display);font-weight:800;font-size:.62px;fill:#fff;paint-order:stroke;stroke:#0d2a40;stroke-width:.14px}
.rmap .off{fill:none;stroke:var(--danger);stroke-width:.1;stroke-dasharray:.18 .12}
.linkrow{display:flex;gap:8px}
.linkrow input{flex:1;min-width:0;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.bigcode{font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:.12em;color:var(--accent)}
.rank{display:grid;gap:8px}
.rank div{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600}
.rank div:first-child{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.rank b{font-family:var(--f-display);font-size:20px}
.fx{position:fixed;inset:0;z-index:30;display:grid;place-items:center;overflow:hidden;cursor:pointer;
  background:radial-gradient(circle at 50% 50%, rgba(120,40,22,.55), rgba(14,6,4,.88) 70%);animation:fxbg 3.4s ease forwards}
.fx .fxin{position:relative;text-align:center;color:#f3e6c4;padding:24px max(16px,env(safe-area-inset-left,0px));max-width:640px;animation:fxin 3.4s ease forwards}
.fx .eyebrow{font-family:var(--f-body);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#e0a32e;font-weight:700}
.fx h2{font-family:"IM Fell English", Georgia, serif;font-weight:400;font-size:clamp(44px,11vw,96px);line-height:1;margin:10px 0 12px;text-shadow:0 0 28px rgba(224,163,46,.55), 0 2px 0 #3a120a}
.fx p{font-family:var(--f-body);font-size:16px;margin:0;color:#e9dcbc}
.fx .ring{position:absolute;left:50%;top:50%;width:46vmin;height:46vmin;margin:-23vmin 0 0 -23vmin;border:2px solid #e0a32e;border-radius:50%;opacity:0;animation:ring 1.7s ease-out 3}
.fx .ring.r2{animation-delay:.55s;border-color:#8f3a22}
.fx .eyes{position:absolute;inset:0;pointer-events:none}
.fx .eyes i{position:absolute;width:14px;height:9px;border-radius:50%;background:radial-gradient(circle,#e0a32e 0 30%,#8f3a22 32% 60%,transparent 62%);opacity:0;animation:blink 3.4s ease forwards}
@keyframes fxbg{0%{opacity:0}8%{opacity:1}82%{opacity:1}100%{opacity:0}}
@keyframes fxin{0%{transform:scale(1.5);opacity:0;filter:blur(10px)}14%{transform:scale(1);opacity:1;filter:blur(0)}82%{opacity:1}100%{opacity:0;transform:scale(.96)}}
@keyframes ring{0%{transform:scale(.25);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes blink{0%,20%{opacity:0}35%{opacity:.9}45%{opacity:.1}55%,80%{opacity:.8}100%{opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,3px)}80%{transform:translate(2px,-1px)}}
.shake{animation:shake .5s ease}
.lastbadge{color:var(--danger);font-weight:700}
@media (prefers-reduced-motion:no-preference){ .lastbadge{animation:pulse 1.6s ease-in-out infinite} }
@media (prefers-reduced-motion:reduce){ .fx,.fx .fxin,.fx .ring,.fx .eyes i,.shake{animation:none!important} .fx .ring,.fx .eyes{display:none} }
/* ---- Décompte final animé ---- */
.finale{position:fixed;inset:0;z-index:35;background:var(--bg);overflow:auto;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.fwrap{max-width:1300px;margin:0 auto;display:grid;gap:16px}
.fhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;min-height:92px}
.fhead .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
.fhead h2{font-family:"IM Fell English", Georgia, serif;font-weight:400;font-size:clamp(32px,6vw,56px);line-height:1.05;margin-top:2px}
.fhead .sub{color:var(--muted);font-size:15px;margin-top:2px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;min-width:0;align-content:start;transition:box-shadow .4s, border-color .4s}
.fcard.win{border-color:var(--hi);box-shadow:0 0 0 2px var(--hi),0 12px 34px color-mix(in srgb,var(--hi) 30%,transparent)}
.ftop{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.fname{font-weight:700;font-size:15px;min-width:0;overflow-wrap:anywhere;display:grid}
.rankb{font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--muted);min-height:1.2em}
.fcard.win .rankb{color:var(--hi)}
.ftot{font-family:var(--f-display);font-weight:800;font-size:38px;font-variant-numeric:tabular-nums;line-height:1;display:inline-block}
.fcard svg{width:100%;height:auto;display:block}
.fchips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.fchip{border:1px solid var(--line);border-radius:8px;padding:3px 6px;display:flex;justify-content:space-between;gap:4px;font-size:11.5px;min-width:0;color:var(--muted);transition:border-color .3s, background .3s}
.fchip b{font-variant-numeric:tabular-nums;color:var(--ink)}
.fchip.cur{border-color:var(--hi)}
.fchip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.fol{fill:none;stroke:var(--hi);stroke-width:.13}
.fol.fz{stroke:var(--danger);stroke-dasharray:.2 .14;stroke-width:.09}
.pop{font-family:var(--f-display);font-weight:800;font-size:.95px;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:.2px;text-anchor:middle}
.pop.zero{fill:var(--danger)}
.pop.big{font-size:1.5px}
.fend{display:grid;gap:12px;justify-items:start}
.fend p{font-family:"IM Fell English", Georgia, serif;font-size:24px;margin:0;max-width:40ch}
@media (prefers-reduced-motion:no-preference){
  .finale{animation:fadein .45s ease}
  .ftitle.in{animation:tin .6s cubic-bezier(.2,.8,.2,1)}
  .ftot.bump{animation:bump .32s ease}
  .fol{animation:olin .25s both}
  .pop{animation:pop 1.4s ease-out forwards;transform-box:fill-box;transform-origin:center}
  .fcard.win{animation:winpulse 1.8s ease-in-out 2}
  @keyframes fadein{from{opacity:0}}
  @keyframes tin{0%{opacity:0;transform:translateY(12px);filter:blur(5px)}100%{opacity:1;transform:none;filter:none}}
  @keyframes bump{50%{transform:scale(1.2);color:var(--accent)}}
  @keyframes olin{from{opacity:0}}
  @keyframes pop{0%{opacity:0;transform:translateY(.3px) scale(.4)}16%{opacity:1;transform:scale(1.25)}32%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-1.3px)}}
  @keyframes winpulse{50%{transform:scale(1.02)}}
}

/* ===================== Style BD / manga minimaliste ===================== */
/* Layout : cases de BD à bord épais et ombre franche ; encre noire, papier blanc, une couleur d'accent rouge */
:root{
  --paper:#fbfaf6; --ink:#141414; --bg:#fbfaf6; --panel:#ffffff; --muted:#555555; --line:#141414;
  --accent:#e8412f; --accent-ink:#ffffff; --cell:#ffffff; --cell-line:#141414; --hi:#ffd23f; --danger:#e8412f;
  --t-blue:#55aee6; --t-blue-d:#2f78ad; --t-grey:#b7bdc3; --t-grey-d:#7a8188; --t-brown:#b0743f; --t-brown-d:#76491f;
  --t-green:#6cc35a; --t-green-d:#3c8a2c; --t-yellow:#ffd23f; --t-yellow-d:#c99b12; --t-red:#ef5a46; --t-red-d:#a8301f;
  --t-any:#eeeeee; --t-any-d:#9a9a9a;
  --f-display:"Dela Gothic One","Arial Black",Impact,sans-serif;
  --f-body:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:5px 5px 0 var(--ink);
  color-scheme:light;
}
body{background:var(--paper) radial-gradient(circle,rgba(20,20,20,.07) 1px,transparent 1.3px) 0 0/7px 7px;color:var(--ink);font-family:var(--f-body);font-weight:500}
h1,h2,h3{font-family:var(--f-display);font-weight:400}
.top h1{font-weight:400;letter-spacing:0;font-size:clamp(30px,5.5vw,44px)}
.top h1 span{color:var(--accent)}
.top h1::after{content:"ハーモニーズ";display:inline-block;margin-left:12px;vertical-align:middle;font-family:var(--f-body);font-weight:900;font-size:12px;letter-spacing:.25em;background:var(--ink);color:#fff;padding:3px 8px;transform:translateY(-4px) rotate(-3deg)}
.meta{color:var(--ink);font-weight:700}
.panel{background:#fff;border:3px solid var(--ink);border-radius:4px;box-shadow:var(--shadow)}
.label{color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:12px;letter-spacing:.06em}
.btn{border:2.5px solid var(--ink);border-radius:999px;background:#fff;box-shadow:3px 3px 0 var(--ink);font-weight:700;font-family:var(--f-body);transition:transform .08s, box-shadow .08s}
.btn:not([disabled]):hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:not([disabled]):active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--ink)}
.btn[disabled]{opacity:.35;box-shadow:none}
.chip{border:2.5px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);font-weight:700}
.chip .dot{border:2px solid var(--ink);width:12px;height:12px;background:#fff}
.chip.cur .dot{background:var(--accent)}
.chip.view{background:var(--hi)}
.chip b{font-family:var(--f-display);font-weight:400}
.tag{border:1.5px solid var(--ink);color:var(--ink);background:#fff;font-weight:900}
.slot{border:2.5px solid var(--ink);border-radius:10px;background:#fff;box-shadow:3px 3px 0 var(--ink);transition:transform .08s, box-shadow .08s}
.slot:not([disabled]):hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink);border-color:var(--ink)}
.slot[disabled]{box-shadow:none;background:radial-gradient(circle,rgba(20,20,20,.12) 1px,transparent 1.3px) 0 0/5px 5px #fff}
/* Bulle de dialogue pour les consignes */
.play > .panel:first-child{background:transparent;border:0;box-shadow:none;padding:0}
.guide p{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:22px;padding:10px 16px;font-weight:700;box-shadow:3px 3px 0 var(--ink)}
.guide p::after{content:"";position:absolute;left:26px;bottom:-8.5px;width:13px;height:13px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg) skew(8deg,8deg)}
.guide{margin-bottom:6px}
.guide .who{color:var(--accent);font-family:var(--f-display);font-weight:400}

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><pattern id="tone" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".55" fill="#141414" opacity=".22"/></pattern></defs></svg>

<script>
(function(){
const SQ3 = Math.sqrt(3);
const ROWS = [5,4,5,4,5];
const CELLS = [];
ROWS.forEach((n,r)=>{ for(let c=0;c<n;c++){ CELLS.push({id:CELLS.length,q:c-(r-(r&1))/2,r,x:SQ3*(c+0.5*(r&1)),y:1.5*r}); } });
const KEY = {}; CELLS.forEach(c=>KEY[c.q+','+c.r]=c.id);
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const NB = CELLS.map(c=>DIRS.map(([dq,dr])=>KEY[(c.q+dq)+','+(c.r+dr)]).filter(v=>v!==undefined));
const BAG = {blue:23,grey:23,brown:21,green:19,yellow:19,red:15};
const COLNAME = {blue:"eau",grey:"montagne",brown:"tronc",green:"feuillage",yellow:"champ",red:"bâtiment"};
const HUES = ["#d9534f","#f0ad4e","#5b8def","#9b59b6","#1abc9c","#e67e22","#34495e","#e84393"];

// Cartes Animal (motifs originaux). La première case du motif reçoit le cube.
const W=t=>({t:"water"}), F=()=>({t:"field"}), T=h=>({t:"tree",h}), M=h=>({t:"mountain",h}), B=()=>({t:"building"});
function pat(list){ return list.map(([q,r,req])=>Object.assign({q,r},req)); }
const CARDS = [
 {n:"Héron",      p:[2,5,9],    c:pat([[0,0,W()],[1,0,F()]])},
 {n:"Grenouille", p:[3,7,12],   c:pat([[0,0,W()],[1,0,T(1)]])},
 {n:"Loutre",     p:[4,9,15],   c:pat([[0,0,W()],[1,0,W()],[2,0,T(2)]])},
 {n:"Castor",     p:[5,12],     c:pat([[0,0,W()],[1,0,T(2)],[0,1,T(2)]])},
 {n:"Saumon",     p:[5,11],     c:pat([[0,0,W()],[1,0,M(2)]])},
 {n:"Martin-pêcheur", p:[4,9,15], c:pat([[0,0,T(1)],[1,0,W()],[2,0,W()]])},
 {n:"Hérisson",   p:[4,9,15],   c:pat([[0,0,T(1)],[1,0,B()]])},
 {n:"Écureuil",   p:[6,13],     c:pat([[0,0,T(3)],[1,0,T(2)]])},
 {n:"Chouette",   p:[6,14],     c:pat([[0,0,T(3)],[1,0,B()]])},
 {n:"Cerf",       p:[5,11,18],  c:pat([[0,0,T(2)],[1,0,F()],[2,0,F()]])},
 {n:"Lièvre",     p:[3,7,12],   c:pat([[0,0,F()],[1,0,F()],[0,1,T(1)]])},
 {n:"Alouette",   p:[2,5,9,14], c:pat([[0,0,F()],[1,0,M(1)]])},
 {n:"Renard",     p:[6,13],     c:pat([[0,0,F()],[1,0,T(2)],[2,0,B()]])},
 {n:"Ours",       p:[7,15],     c:pat([[0,0,M(2)],[1,0,T(3)]])},
 {n:"Chamois",    p:[4,9,15],   c:pat([[0,0,M(2)],[1,0,M(1)]])},
 {n:"Aigle",      p:[8,17],     c:pat([[0,0,M(3)],[1,0,M(2)]])},
 {n:"Marmotte",   p:[5,11],     c:pat([[0,0,M(1)],[1,0,F()],[0,1,M(1)]])},
 {n:"Cigogne",    p:[6,13],     c:pat([[0,0,B()],[1,0,F()],[0,1,W()]])},
 {n:"Moineau",    p:[3,7,12],   c:pat([[0,0,B()],[1,0,T(1)]])},
 {n:"Chauve-souris", p:[5,11,18], c:pat([[0,0,B()],[1,0,M(2)]])},
 {n:"Canard",     p:[3,7,12],   c:pat([[0,0,W()],[1,0,W()],[0,1,W()]])},
 {n:"Brochet",    p:[3,7,12],   c:pat([[0,0,W()],[1,0,M(1)]])},
 {n:"Sanglier",   p:[6,13],     c:pat([[0,0,F()],[1,0,T(2)],[0,1,T(2)]])},
 {n:"Blaireau",   p:[4,9,15],   c:pat([[0,0,M(1)],[1,0,T(2)]])},
 {n:"Loup",       p:[6,13],     c:pat([[0,0,M(2)],[1,0,T(2)],[2,0,T(1)]])},
 {n:"Lynx",       p:[7,15],     c:pat([[0,0,T(3)],[1,0,M(1)],[0,1,M(1)]])},
 {n:"Bouquetin",  p:[6,14],     c:pat([[0,0,M(3)],[1,0,M(1)]])},
 {n:"Corbeau",    p:[3,7,12],   c:pat([[0,0,B()],[1,0,F()]])},
 {n:"Rat",        p:[4,9,15],   c:pat([[0,0,B()],[1,0,W()]])},
 {n:"Chat",       p:[5,11],     c:pat([[0,0,B()],[1,0,B()]])},
 {n:"Abeille",    p:[4,9,15],   c:pat([[0,0,F()],[1,0,F()],[2,0,B()]])},
 {n:"Couleuvre",  p:[5,11,18],  c:pat([[0,0,F()],[1,0,W()],[2,0,M(1)]])}
];
CARDS.forEach((c,i)=>c.hue=HUES[i%HUES.length]);

// ---------- Règles ----------
function canPlace(cell, col){
  if(cell.cube) return false;
  const s=cell.s, n=s.length;
  if(n===0) return true;
  const top=s[n-1], allG=s.every(x=>x==="grey"), allB=s.every(x=>x==="brown");
  if(col==="grey") return allG && n<3;
  if(col==="brown") return n===1 && top==="brown";
  if(col==="green") return allB && n<=2;
  if(col==="red") return n===1 && (top==="brown"||top==="grey"||top==="red");
  return false;
}
function kind(s){
  const n=s.length; if(!n) return {t:"empty"};
  const top=s[n-1];
  if(s.every(x=>x==="grey")) return {t:"mountain",h:n};
  if(top==="green") return {t:"tree",h:n};
  if(s.every(x=>x==="brown")) return {t:"trunk",h:n};
  if(n===2 && top==="red") return {t:"building"};
  if(top==="blue") return {t:"water"};
  if(top==="yellow") return {t:"field"};
  return {t:"red"};
}
function matches(req, s){ const k=kind(s); return k.t===req.t && (req.h==null || req.h===k.h); }
function rot(q,r){ return [-r,q+r]; }
function targets(board, cardId){
  const pc=CARDS[cardId].c, out=new Set();
  for(const a of CELLS){
    if(board[a.id].cube) continue;
    for(let k=0;k<6;k++){
      let ok=true;
      for(const p of pc){
        let dq=p.q, dr=p.r; for(let i=0;i<k;i++) [dq,dr]=rot(dq,dr);
        const id=KEY[(a.q+dq)+','+(a.r+dr)];
        if(id===undefined || !matches(p, board[id].s)){ ok=false; break; }
      }
      if(ok){ out.add(a.id); break; }
    }
  }
  return out;
}
function riverPts(L){ if(L<2) return 0; if(L<=6) return [0,0,2,5,8,11,15][L]; return 15+4*(L-6); }
function score(p, side){
  const b=p.board, K=b.map(c=>kind(c.s));
  let trees=0, mountains=0, fields=0, buildings=0, water=0, animals=0;
  K.forEach((k,i)=>{
    if(k.t==="tree") trees+=[0,1,3,7][k.h];
    if(k.t==="mountain" && NB[i].some(j=>K[j].t==="mountain")) mountains+=[0,1,3,7][k.h];
    if(k.t==="building"){ const cols=new Set(NB[i].filter(j=>b[j].s.length).map(j=>b[j].s[b[j].s.length-1])); if(cols.size>=3) buildings+=5; }
  });
  const comps=(pred)=>{ const seen=new Set(), res=[]; CELLS.forEach(c=>{ if(seen.has(c.id)||!pred(c.id)) return; const st=[c.id], g=[]; seen.add(c.id); while(st.length){const x=st.pop(); g.push(x); NB[x].forEach(y=>{ if(!seen.has(y)&&pred(y)){seen.add(y);st.push(y);} });} res.push(g); }); return res; };
  comps(i=>K[i].t==="field").forEach(g=>{ if(g.length>=2) fields+=5; });
  let river=0, islands=0;
  if(side==="A"){
    comps(i=>K[i].t==="water").forEach(g=>{
      const set=new Set(g);
      g.forEach(s=>{ const d={[s]:0}, qu=[s]; while(qu.length){ const x=qu.shift(); NB[x].forEach(y=>{ if(set.has(y)&&d[y]===undefined){ d[y]=d[x]+1; qu.push(y);} }); } river=Math.max(river, 1+Math.max(...Object.values(d))); });
    });
    water=riverPts(river);
  } else {
    islands=comps(i=>K[i].t!=="water").length; water=islands*5;
  }
  [...p.cards,...p.done].forEach(c=>{ if(c.placed) animals+=CARDS[c.id].p[c.placed-1]; });
  return {trees,mountains,fields,buildings,water,river,islands,animals,total:trees+mountains+fields+buildings+water+animals};
}

// ---------- État ----------
const LV=["Facile","Moyen","Difficile"], BOTNAME=["Le Novice","L'Érudit","L'Ancien"];
let S=null, modal=null, setup={n:2,names:["Joueur 1","L'Érudit","L'Érudit","L'Érudit"],types:["human","bot","bot","bot"],lv:[1,1,1,1],side:"A"};
const isBot=p=>!!p && p.bot!=null;
let botTimer=null, botGen=0;
Object.assign(setup,{mode:"local",onl:"create",code:"",err:"",on:2,ot:["human","human","bot","bot"],ol:[1,1,1,1]});
const save=()=>{ if(NET.on){ netPush(); return; } try{ localStorage.setItem("harmonies-save", JSON.stringify(S)); }catch(e){} };
const load=()=>{ try{ const v=localStorage.getItem("harmonies-save"); return v?JSON.parse(v):null; }catch(e){ return null; } };
const clone=o=>JSON.parse(JSON.stringify(o));
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const solo=()=>S.players.length===1;
const nSlots=()=>solo()?3:5;
function draw3(){ return S.bag.length>=3 ? S.bag.splice(0,3) : null; }

function newGame(){
  const bag=[]; Object.entries(BAG).forEach(([c,n])=>{ for(let i=0;i<n;i++) bag.push(c); });
  S={ side:setup.side, bag:shuffle(bag), deck:shuffle(CARDS.map((_,i)=>i)), central:[], display:[], cur:0, view:0, round:1, endTriggered:false, over:false,
      players:setup.names.slice(0,setup.n).map((n,i)=>{ const bot=setup.types[i]==="bot"?setup.lv[i]:null; return {name:(n||"").trim()||(bot!=null?BOTNAME[bot]:"Joueur "+(i+1)), bot, uid:(setup.uids&&setup.uids[i])||null, board:CELLS.map(()=>({s:[],cube:null})), cards:[], done:[], cubes:0}; }) };
  for(let i=0;i<nSlots();i++) S.central.push(draw3());
  for(let i=0;i<nSlots();i++) S.display.push(S.deck.shift());
  startTurn();
}
function startTurn(){
  S.turn={picked:null, hand:[], sel:null, tookCard:false, swapped:false, selCard:null};
  S.snap=null; S.snap=JSON.stringify(Object.assign({},S,{snap:null}));
}
const P=()=>S.players[S.cur];
const active=()=>S.view===S.cur && !S.over && !isBot(P()) && (!NET.on || P().uid===NET.me);

function pick(i){ if(!active()||S.turn.picked!==null||!S.central[i]) return; S.turn.hand=S.central[i]; S.central[i]=null; S.turn.picked=i; S.turn.sel=0; S.turn.selCard=null; commit(); }
function legalCells(col){ return CELLS.filter(c=>canPlace(P().board[c.id],col)).map(c=>c.id); }
function cellTap(id){
  if(!active()) return;
  const t=S.turn, p=P();
  if(t.selCard!==null){
    const card=p.cards[t.selCard];
    if(card && targets(p.board,card.id).has(id)){
      p.board[id].cube={hue:CARDS[card.id].hue,cid:card.id}; card.placed++; p.cubes++;
      if(card.placed===CARDS[card.id].p.length){ p.done.push(card); p.cards.splice(t.selCard,1); t.selCard=null; }
      else if(!targets(p.board,card.id).size) t.selCard=null;
      if(t.selCard===null && t.hand.length) t.sel=0;
      commit();
    }
    return;
  }
  if(t.sel!==null && t.hand[t.sel]){
    const col=t.hand[t.sel];
    if(canPlace(p.board[id],col)){ p.board[id].s.push(col); t.hand.splice(t.sel,1); t.sel=t.hand.length?0:null; commit(); }
  }
}
function discardTok(){ const t=S.turn; if(t.sel===null) return; t.hand.splice(t.sel,1); t.sel=t.hand.length?0:null; commit(); }
function takeCard(i){
  const t=S.turn, p=P();
  if(!active()||S.display[i]==null) return;
  if(t.swapMode){ S.deck.length? S.display[i]=S.deck.shift() : S.display[i]=null; t.swapped=true; t.swapMode=false; commit(); return; }
  if(t.tookCard||t.swapped||p.cards.length>=4) return;
  p.cards.push({id:S.display[i],placed:0}); S.display[i]=null; t.tookCard=true; commit();
}
function selCard(i){ if(!active()) return; const t=S.turn; t.selCard = t.selCard===i?null:i; if(t.selCard===null && t.hand.length) t.sel=0; commit(); }
function emptyCount(p){ return p.board.filter(c=>!c.s.length).length; }
function endTurn(){
  const t=S.turn, p=P();
  if(t.picked===null || t.hand.length) return;
  if(solo()) S.central=S.central.map(()=>null);
  const was=S.endTriggered; let bagOut=false, full=false;
  S.central=S.central.map(s=>{ if(s) return s; const d=draw3(); if(!d){ S.endTriggered=true; bagOut=true; } return d; });
  S.display=S.display.map(c=> c==null ? (S.deck.length?S.deck.shift():null) : c);
  const left=emptyCount(p);
  if(left<=2){ S.endTriggered=true; full=true; }
  const fresh=!was && S.endTriggered;
  if(fresh){
    const rb= left===0 ? `le plateau de ${p.name} est plein` : `le plateau de ${p.name} n'a plus que ${left} case${left>1?"s":""} libre${left>1?"s":""}`;
    S.endReason = bagOut && full ? `Le sac est vide et ${rb}` : bagOut ? "Le sac est vide" : rb.charAt(0).toUpperCase()+rb.slice(1);
  }
  if(S.endTriggered && S.cur===S.players.length-1){ S.over=true; S.turn={picked:null,hand:[],sel:null}; commit(); startFinale(); return; }
  const remaining=S.players.length-1-S.cur;
  S.cur=(S.cur+1)%S.players.length; if(S.cur===0) S.round++;
  S.view=S.cur; startTurn();
  if(fresh) lastRoundFx(bagOut, remaining);
  commit();
}
let fxOn=false, fxTimer=null;
function endFx(){ fxOn=false; clearTimeout(fxTimer); document.getElementById("fx").innerHTML=""; maybeBot(); }

// ---------- Bots ----------
function clonePl(pl){ return {board:pl.board.map(c=>({s:c.s.slice(),cube:c.cube})),cards:pl.cards.map(c=>({id:c.id,placed:c.placed})),done:pl.done.map(c=>({id:c.id,placed:c.placed})),cubes:pl.cubes}; }
function applyCube(pl,cid,cell){ const c=pl.cards.find(x=>x.id===cid); if(!c) return; pl.board[cell].cube={hue:CARDS[cid].hue,cid}; c.placed++; pl.cubes++; if(c.placed===CARDS[cid].p.length){ pl.done.push(c); pl.cards.splice(pl.cards.indexOf(c),1); } }
function isPrefix(s,R){ if(s.length>=R.length) return false; return s.every((x,i)=>R[i]==="any"?(x==="brown"||x==="grey"||x==="red"):x===R[i]); }
// Proximité du motif d'une carte : 1 = cube posable maintenant.
function partialFrac(board,id){
  const pc=CARDS[id].c, R=pc.map(reqStack); let best=0;
  for(const a of CELLS){
    if(board[a.id].cube) continue;
    for(let k=0;k<6;k++){
      let sum=0, ok=true;
      for(let j=0;j<pc.length;j++){ const p=pc[j]; let dq=p.q, dr=p.r; for(let i=0;i<k;i++) [dq,dr]=rot(dq,dr);
        const id2=KEY[(a.q+dq)+','+(a.r+dr)]; if(id2===undefined){ ok=false; break; }
        const c=board[id2];
        if(matches(p,c.s)) sum+=1; else if(!c.cube && isPrefix(c.s,R[j])) sum+=.25+.45*c.s.length/R[j].length; else { ok=false; break; } }
      if(ok) best=Math.max(best,sum/pc.length);
      if(best>=1) return 1;
    }
  }
  return best;
}
function evalP(pl,side,lvl){
  const sc=score(pl,side).total; if(lvl===0) return sc;
  const w=lvl===2?1:.3, b=pl.board, K=b.map(c=>kind(c.s)); let pot=0;
  K.forEach((k,i)=>{ const c=b[i]; if(c.cube) return; const emptyNb=NB[i].some(j=>!b[j].s.length);
    if(k.t==="trunk") pot+=k.h===1?1.5:3.5;
    else if(k.t==="tree" && k.h<3) pot+=k.h===1?.8:2;
    else if(k.t==="mountain"){ if(!NB[i].some(j=>K[j].t==="mountain")) pot+=emptyNb?k.h*.9:0; else if(k.h<3) pot+=.5; }
    else if(k.t==="field" && !NB[i].some(j=>K[j].t==="field") && emptyNb) pot+=1.5;
    else if(k.t==="red") pot+=1.2;
    else if(k.t==="building" && emptyNb){ const cols=new Set(NB[i].filter(j=>b[j].s.length).map(j=>b[j].s[b[j].s.length-1])); if(cols.size<3) pot+=1.5; }
  });
  if(side==="A" && K.some(k=>k.t==="water")) pot+=1.5;
  pl.cards.forEach(c=>{ const nx=CARDS[c.id].p[c.placed]; const f=partialFrac(b,c.id); pot+= f>=1 ? nx*.9 : f*f*nx*(lvl===2?.7:.4); });
  if(lvl===2) pot+=b.filter(c=>!c.s.length).length*1.6;
  return sc+pot*w;
}
function simCubes(pl,lvl,steps){
  let moved=true;
  while(moved){ moved=false;
    for(const c of pl.cards.slice()){
      const tg=[...targets(pl.board,c.id)]; if(!tg.length) continue;
      let cell=tg[0];
      if(lvl===2 && tg.length>1){ let best=-1e9; tg.forEach(id=>{ const t=clonePl(pl); applyCube(t,c.id,id); const v=evalP(t,S.side,2); if(v>best){best=v;cell=id;} }); }
      applyCube(pl,c.id,cell); steps.push({k:"cube",cid:c.id,cell}); moved=true; break;
    }
  }
}
function perms(a){ if(a.length<=1) return [a]; const out=[], seen=new Set(); a.forEach((x,i)=>{ if(seen.has(x)) return; seen.add(x); perms(a.slice(0,i).concat(a.slice(i+1))).forEach(r=>out.push([x,...r])); }); return out; }
function planLot(pl0,toks,lvl){
  const K=lvl===2?3:1, orders=lvl===2?perms(toks):[toks]; let best=null;
  for(const ord of orders){
    const s0={pl:clonePl(pl0),steps:[]}; simCubes(s0.pl,lvl,s0.steps); let beam=[s0];
    for(const col of ord){
      const next=[];
      for(const st of beam){
        const cells=CELLS.filter(c=>canPlace(st.pl.board[c.id],col)).map(c=>c.id);
        if(!cells.length){ next.push({pl:st.pl,steps:[...st.steps,{k:"discard",col}],v:evalP(st.pl,S.side,lvl)}); continue; }
        for(const cell of cells){ const pl=clonePl(st.pl), steps=[...st.steps,{k:"tok",col,cell}]; pl.board[cell].s.push(col); simCubes(pl,lvl,steps); next.push({pl,steps,v:evalP(pl,S.side,lvl)}); }
      }
      next.sort((a,b)=>b.v-a.v); beam=next.slice(0,K);
    }
    if(!best||beam[0].v>best.v) best=beam[0];
  }
  return best;
}
function planEasy(pl0,toks){
  const pl=clonePl(pl0), steps=[]; simCubes(pl,0,steps);
  for(const col of toks){
    const cells=CELLS.filter(c=>canPlace(pl.board[c.id],col)).map(c=>c.id);
    if(!cells.length){ steps.push({k:"discard",col}); continue; }
    let cell=cells[Math.floor(Math.random()*cells.length)];
    if(Math.random()<.45){ let bv=-1e9; cells.forEach(id=>{ const t=clonePl(pl); t.board[id].s.push(col); const v=score(t,S.side).total+Math.random(); if(v>bv){bv=v;cell=id;} }); }
    pl.board[cell].s.push(col); steps.push({k:"tok",col,cell}); simCubes(pl,0,steps);
  }
  return {steps};
}
function botPlan(){
  const p=P(), lvl=p.bot, lots=S.central.map((s,i)=>s?i:-1).filter(i=>i>=0);
  let card=null; const pl0=clonePl(p);
  const cand=S.display.map((id,i)=>id==null?-1:i).filter(i=>i>=0);
  if(cand.length && p.cards.length<[2,3,4][lvl]){
    if(lvl===0){ if(Math.random()<.5) card=cand[Math.floor(Math.random()*cand.length)]; }
    else { let bv=-1; cand.forEach(i=>{ const id=S.display[i], pts=CARDS[id].p, f=partialFrac(p.board,id); const v=(.3+f)*pts[Math.min(1,pts.length-1)]*.5+(lvl===2?f*pts[pts.length-1]*.2:Math.random()); if(v>bv){bv=v;card=i;} }); if(bv<(lvl===2?2:1.5)) card=null; }
  }
  if(card!==null) pl0.cards.push({id:S.display[card],placed:0});
  if(lvl===0){ const lot=lots[Math.floor(Math.random()*lots.length)]; return {lot,card,steps:planEasy(pl0,S.central[lot]).steps}; }
  let best=null, lot=lots[0];
  lots.forEach(i=>{ const r=planLot(pl0,S.central[i],lvl); if(!best||r.v>best.v){best=r;lot=i;} });
  return {lot,card,steps:best.steps};
}
function maybeBot(){ if(S && !S.over && isBot(P()) && (!NET.on || NET.host) && !botTimer && modal!=="setup" && !fxOn && S.turn.picked===null){ const g=botGen; botTimer=setTimeout(()=>runBot(g),650); } }
function runBot(g){
  if(g!==botGen||!S||S.over){ botTimer=null; return; }
  const plan=botPlan(), p=P(), delay=[420,520,600][p.bot];
  const q=[{k:"pick",lot:plan.lot}]; if(plan.card!==null) q.push({k:"card",i:plan.card}); q.push(...plan.steps,{k:"end"});
  const step=()=>{
    if(g!==botGen||!S||S.over){ botTimer=null; return; }
    if(modal==="setup"||fxOn){ botTimer=setTimeout(step,400); return; }
    const s=q.shift(), t=S.turn; S.view=S.cur;
    if(s.k==="pick"){ t.hand=S.central[s.lot].slice(); S.central[s.lot]=null; t.picked=s.lot; }
    else if(s.k==="card"){ p.cards.push({id:S.display[s.i],placed:0}); S.display[s.i]=null; t.tookCard=true; }
    else if(s.k==="tok"){ const j=t.hand.indexOf(s.col); if(j>=0 && canPlace(p.board[s.cell],s.col)){ t.hand.splice(j,1); p.board[s.cell].s.push(s.col); } else if(j>=0){ t.hand.splice(j,1); } }
    else if(s.k==="discard"){ const j=t.hand.indexOf(s.col); if(j>=0) t.hand.splice(j,1); }
    else if(s.k==="cube"){ if(p.cards.find(c=>c.id===s.cid) && targets(p.board,s.cid).has(s.cell)) applyCube(p,s.cid,s.cell); }
    else if(s.k==="end"){ t.hand=[]; botTimer=null; endTurn(); return; }
    save(); render(); botTimer=setTimeout(step,delay);
  };
  botTimer=setTimeout(step,80);
}

function hexPts(cx,cy,R){ let s=""; for(let i=0;i<6;i++){ const a=Math.PI/180*(60*i-90); s+=(cx+R*Math.cos(a)).toFixed(3)+","+(cy+R*Math.sin(a)).toFixed(3)+" "; } return s; }
function stackSvg(s,cx,cy,R,cube){
  let o=""; const rx=R*.62, ry=R*.36, th=R*.25, base=cy+(s.length-2)*th*.5, sw=(R*.0375).toFixed(3);
  s.forEach((c,i)=>{ const y=base-i*th, h=th;
    o+=`<path d="M${cx-rx},${y} L${cx-rx},${y+h} A${rx},${ry} 0 0 0 ${cx+rx},${y+h} L${cx+rx},${y} Z" fill="var(--t-${c}-d)" stroke="#141414" stroke-width="${sw}" stroke-linejoin="round"/>`+
       `<ellipse cx="${cx}" cy="${y}" rx="${rx}" ry="${ry}" fill="var(--t-${c})" stroke="#141414" stroke-width="${sw}"/>`;
    if(i===s.length-1 && c!=="any") o+=`<path d="M${(cx-rx*.62).toFixed(3)},${(y-ry*.05).toFixed(3)} A${(rx*.62).toFixed(3)},${(ry*.62).toFixed(3)} 0 0 1 ${(cx-rx*.12).toFixed(3)},${(y-ry*.6).toFixed(3)}" fill="none" stroke="#ffffff" stroke-width="${(R*.08).toFixed(3)}" stroke-linecap="round"/>`;
  });
  if(cube){ const y=base-(s.length-1)*th, z=R*.4; o+=`<rect x="${cx-z/2}" y="${y-z*.8}" width="${z}" height="${z}" rx="${z*.12}" fill="${cube.hue}" stroke="#141414" stroke-width="${(R*.04).toFixed(3)}"/><rect x="${cx-z/2+z*.16}" y="${y-z*.8+z*.14}" width="${z*.22}" height="${z*.22}" fill="#ffffff" opacity=".85"/>`; }
  return o;
}
function reqStack(r){ if(r.t==="water") return ["blue"]; if(r.t==="field") return ["yellow"]; if(r.t==="tree") return [...Array(r.h-1).fill("brown"),"green"]; if(r.t==="mountain") return Array(r.h).fill("grey"); return ["any","red"]; }
function patternSvg(id){
  const pc=CARDS[id].c, pts=pc.map(p=>({x:SQ3*(p.q+p.r/2),y:1.5*p.r,p}));
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y), m=1.05;
  const vb=[Math.min(...xs)-m,Math.min(...ys)-m-.25,Math.max(...xs)-Math.min(...xs)+2*m,Math.max(...ys)-Math.min(...ys)+2*m+.25];
  let o=`<svg viewBox="${vb.join(" ")}" aria-hidden="true">`;
  pts.forEach(p=>{ o+=`<polygon points="${hexPts(p.x,p.y,1)}" fill="var(--cell)" stroke="var(--cell-line)" stroke-width=".075"/>`; });
  o+=`<polygon points="${hexPts(pts[0].x,pts[0].y,.86)}" fill="none" stroke="${CARDS[id].hue}" stroke-width=".14"/>`;
  pts.forEach((p,i)=>{ o+=stackSvg(reqStack(p.p),p.x,p.y,1,i===0?{hue:CARDS[id].hue}:null); });
  return o+"</svg>";
}
function tokSvg(cols,size){ const w=cols.length*size; let o=`<svg viewBox="0 0 ${w} ${size}" aria-hidden="true">`; cols.forEach((c,i)=>{ const cx=i*size+size/2, cy=size/2-1, r=size*.36, sw=size*.04; o+=`<circle cx="${cx+2}" cy="${cy+2}" r="${r}" fill="#141414"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--t-${c})" stroke="#141414" stroke-width="${sw}"/><path d="M${cx-r*.55},${cy-r*.05} A${r*.6},${r*.6} 0 0 1 ${cx-r*.05},${cy-r*.58}" fill="none" stroke="#fff" stroke-width="${sw*1.1}" stroke-linecap="round"/>`; }); return o+"</svg>"; }

function artSvg(id){
  const a=ART[id];
  return `<svg class="art" viewBox="0 0 100 70" aria-hidden="true"><rect width="100" height="70" fill="${HAB[a.g]}"/><path d="M52,0 L100,0 L100,48Z" fill="url(#tone)"/>${GROUND[a.g]}${a.d.join("")}</svg>`;
}

function cardHtml(id, opts){
  const c=CARDS[id], placed=opts.placed||0;
  const track=c.p.map((v,i)=>i<placed?`<span class="got">${v}</span>`:`<span class="cube" style="--hue:${c.hue}">${v}</span>`).join("");
  return `<button class="card ${opts.cls||""}" data-a="${opts.act}" data-i="${opts.i}" ${opts.dis?"disabled":""} aria-label="${esc(c.n)}">
    ${artSvg(id)}<div class="cname"><i style="background:${c.hue}"></i>${esc(c.n)}</div><div class="lat">${ART[id].lat}</div>${patternSvg(id)}<div class="track">${track}</div></button>`;
}

function render(){
  const app=document.getElementById("app");
  if(!S){ app.innerHTML=`<div class="top"><h1>Harmo<span>nies</span></h1></div>`; if(!NET.on && modal!=="setup") showSetup(); return; }
  const pres=(NET.on&&NET.game&&NET.game.presence)||{};
  const t=S.turn, viewP=S.players[S.view], me=active(), p=P();
  const legal = me && t.selCard===null && t.sel!==null && t.hand[t.sel] ? new Set(legalCells(t.hand[t.sel])) : new Set();
  const tg = me && t.selCard!==null && p.cards[t.selCard] ? targets(p.board,p.cards[t.selCard].id) : new Set();
  const sc=score(viewP,S.side);

  // board
  const xs=CELLS.map(c=>c.x), ys=CELLS.map(c=>c.y);
  let bsvg=`<svg viewBox="${Math.min(...xs)-1.1} ${Math.min(...ys)-1.3} ${Math.max(...xs)-Math.min(...xs)+2.2} ${Math.max(...ys)-Math.min(...ys)+2.5}" role="img" aria-label="Plateau de ${esc(viewP.name)}">`;
  CELLS.forEach(c=>{ const cl=legal.has(c.id)?"legal":tg.has(c.id)?"target":"";
    bsvg+=`<g data-cell="${c.id}"><polygon class="cell ${cl}" points="${hexPts(c.x,c.y,1)}"/>${stackSvg(viewP.board[c.id].s,c.x,c.y,1,viewP.board[c.id].cube)}</g>`; });
  bsvg+="</svg>";

  let guide;
  if(S.over) guide="Partie terminée.";
  else if(isBot(p)) guide=`Bot ${LV[p.bot].toLowerCase()}, il joue son tour<span class="thinking"></span>`;
  else if(NET.on && p.uid!==NET.me) guide=`c'est son tour${pres[p.uid]?"":" (hors ligne)"}<span class="thinking"></span>`;
  else if(!me) guide=`Tu regardes le plateau de ${esc(viewP.name)}.`;
  else if(t.picked===null) guide="Choisis un lot de 3 jetons dans l'offre.";
  else if(t.selCard!==null) guide="Touche une case verte pour y installer l'animal.";
  else if(t.hand.length) guide="Pose tes jetons : choisis-en un, puis une case surlignée.";
  else guide="Installe des animaux si tu peux, puis termine ton tour.";

  const selTok = me && t.sel!==null ? t.hand[t.sel] : null;
  const noRoom = selTok && t.selCard===null && legal.size===0;
  const ready = c=> me && targets(p.board,c.id).size>0;
  const canTake = me && !t.tookCard && !t.swapped && p.cards.length<4;

  app.innerHTML=`
  <div class="top"><h1>Harmo<span>nies</span></h1>
    <div class="meta">${NET.on?`<span>Partie en ligne <b>${NET.code}</b></span>`:""}<span>Tour ${S.round}</span><span>Sac : ${S.bag.length} jetons</span><span>Face ${S.side} · ${S.side==="A"?"rivière":"îles"}</span>${S.endTriggered&&!S.over?`<span class="lastbadge">Dernier tour${S.endReason?" · "+esc(S.endReason):""}</span>`:""}</div>
    <div class="tools">${S.over?`<button class="btn" data-a="finale">Revoir le décompte</button>`:""}<button class="btn" data-a="rules">Règles</button><button class="btn" data-a="new">${NET.on?"Quitter la partie":"Nouvelle partie"}</button></div></div>
  <div class="bar">${S.players.map((pl,i)=>`<button class="chip ${i===S.cur&&!S.over?"cur":""} ${i===S.view?"view":""}" data-a="view" data-i="${i}"><span class="dot"></span>${esc(pl.name)}${isBot(pl)?` <span class="tag">${LV[pl.bot]}</span>`:""}${NET.on&&pl.uid===NET.me?' <span class="tag">toi</span>':""}${NET.on&&!isBot(pl)&&pl.uid&&!pres[pl.uid]?' <span class="tag">hors ligne</span>':""}${S.over?` <b>${score(pl,S.side).total}</b>`:""}</button>`).join("")}</div>
  <section class="panel offer"><div class="label"><span>Offre de jetons</span><span>3 par lot</span></div>
    <div class="slots">${S.central.map((s,i)=>`<button class="slot" data-a="pick" data-i="${i}" ${(!s||!me||t.picked!==null)?"disabled":""} aria-label="Lot ${i+1}">${s?tokSvg(s,28):"<span class='note'>vide</span>"}</button>`).join("")}</div></section>
  <section class="panel animals"><div class="label"><span>Cartes Animal</span><span>${S.deck.length} en pioche</span></div>
    <div class="cards">${S.display.map((id,i)=> id==null?`<div class="card empty">Remplacée en fin de tour</div>`:cardHtml(id,{act:"take",i,dis:!(canTake||(me&&t.swapMode))})).join("")}</div>
    <p class="note">${me? (t.swapMode?"Touche la carte à défausser.": canTake?"Touche une carte pour la prendre (1 par tour, 4 en cours maximum).":p.cards.length>=4?"Tu as déjà 4 cartes en cours.":"Carte déjà prise ce tour-ci.") : ""}</p>
    ${me&&solo()&&!t.tookCard&&!t.swapped?`<button class="btn" data-a="swap" style="margin-top:8px">${t.swapMode?"Annuler":"Remplacer une carte"}</button>`:""}</section>

function scoreDetail(p, side){
  const b=p.board, K=b.map(c=>kind(c.s)), top=i=>b[i].s[b[i].s.length-1];
  const comps=(pred)=>{ const seen=new Set(), res=[]; CELLS.forEach(c=>{ if(seen.has(c.id)||!pred(c.id)) return; const st=[c.id], g=[]; seen.add(c.id); while(st.length){const x=st.pop(); g.push(x); NB[x].forEach(y=>{ if(!seen.has(y)&&pred(y)){seen.add(y);st.push(y);} });} res.push(g); }); return res; };

    if(ok) mo.push({l:`${ok} montagne${pl(ok)} de hauteur ${h}`,w:`${ok} × ${[0,1,3,7][h]}`,v:ok*[0,1,3,7][h]});
    if(iso) mo.push({l:`${iso} montagne${pl(iso)} isolée${pl(iso)} de hauteur ${h}`,w:"ne touche aucune autre montagne",v:0}); });
  sec.push({h:"Montagnes",r:mo});
  // Champs

  big.forEach(g=>fi.push({l:`Champ de ${g.length} jetons jaunes`,w:g.length>2?"5 points quelle que soit la taille":"",v:5}));
  if(single) fi.push({l:`${single} jeton${pl(single)} jaune${pl(single)} seul${pl(single)}`,w:"il faut au moins 2 jaunes côte à côte",v:0});
  sec.push({h:"Champs",r:fi});
  // Bâtiments
  const bu=[]; K.forEach((k,i)=>{ if(k.t!=="building") return; const cols=[...new Set(NB[i].filter(j=>b[j].s.length).map(top))];
    const base={brown:"sur tronc",grey:"sur montagne",red:"tour"}[b[i].s[0]];
    bu.push({l:`Bâtiment ${base}`,w:`${cols.length} couleur${pl(cols.length)} autour${cols.length?" : "+cols.map(c=>COLNAME[c]).join(", "):""}${cols.length<3?" (il en faut 3)":""}`,v:cols.length>=3?5:0}); });
  const lone=K.filter(k=>k.t==="red").length; if(lone) bu.push({l:`${lone} jeton${pl(lone)} rouge${pl(lone)} posé${pl(lone)} au sol`,w:"un bâtiment doit être sur un tronc, une montagne ou un rouge",v:0});
  sec.push({h:"Bâtiments",r:bu});
  // Eau

  if(side==="A"){
    let best=0;
    comps(i=>K[i].t==="water").forEach(g=>{ const set=new Set(g); g.forEach(s=>{ const d={[s]:0}, qu=[s]; while(qu.length){ const x=qu.shift(); NB[x].forEach(y=>{ if(set.has(y)&&d[y]===undefined){ d[y]=d[x]+1; qu.push(y);} }); } best=Math.max(best,1+Math.max(...Object.values(d))); }); });
    if(best) wa.push({l:`Plus longue rivière : ${best} jeton${pl(best)}`,w:best<2?"une rivière compte à partir de 2 jetons":best>6?`15 + ${best-6} × 4`:"barème 2 / 5 / 8 / 11 / 15",v:riverPts(best)});
    if(blue>best) wa.push({l:`${blue-best} jeton${pl(blue-best)} bleu${pl(blue-best)} hors du trajet`,w:"branches, épaisseurs ou autres rivières : seul le plus court chemin entre les deux bouts compte",v:0});
  } else {
    const isl=comps(i=>K[i].t!=="water");
    isl.forEach((g,n)=>wa.push({l:`Île ${n+1} : ${g.length} case${pl(g.length)}`,w:"",v:5}));
  }

  // Animaux
  const an=[]; [...p.done,...p.cards].forEach(c=>{ const C=CARDS[c.id], n=C.p.length;

function riverPath(p){

}

function groupsOf(pred){ const seen=new Set(), res=[]; CELLS.forEach(c=>{ if(seen.has(c.id)||!pred(c.id)) return; const st=[c.id], g=[]; seen.add(c.id); while(st.length){const x=st.pop(); g.push(x); NB[x].forEach(y=>{ if(!seen.has(y)&&pred(y)){seen.add(y);st.push(y);} });} res.push(g); }); return res; }

    const un=auth.onAuthStateChanged(u=>{ if(u){ un(); NET.me=u.uid; res(); } });
    auth.signInAnonymously().catch(e=>{ fbReady=null; rej(e); });
  });
  return fbReady;
}
const CODECH="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const genCode=()=>Array.from({length:5},()=>CODECH[Math.floor(Math.random()*CODECH.length)]).join("");
const gref=c=>firebase.database().ref("games/"+c);
function netErr(msg){ setup.err=msg; setup.mode="online"; showSetup(); }
const FBERR="Connexion à Firebase impossible. Vérifie firebase-config.js, que la connexion anonyme est activée et que tu es en ligne.";
async function netCreate(){
  readNames(); setup.err="";
  const name=(setup.names[0]||"").trim(); if(!name) return netErr("Indique ton nom.");
  try{ await fb(); }catch(e){ return netErr(FBERR); }
  try{
    let code, ok=false;
    for(let k=0;k<6&&!ok;k++){ code=genCode(); ok=!(await gref(code).once("value")).exists(); }
    const seats=[{type:"human",lv:0,uid:NET.me,name}];
    for(let i=1;i<setup.on;i++) seats.push(setup.ot[i]==="bot"?{type:"bot",lv:setup.ol[i],uid:"",name:BOTNAME[setup.ol[i]]+(seats.some(x=>x.name===BOTNAME[setup.ol[i]])?" "+(i+1):"")}:{type:"human",lv:0,uid:"",name:""});
    await gref(code).set({host:NET.me,status:"lobby",side:setup.side,seats,v:0,created:Date.now()});
    netEnter(code);
  }catch(e){ netErr("La base de données a refusé l'écriture. Vérifie les règles de sécurité (voir le guide)."); }
}
async function netJoin(code,silent){
  readNames(); setup.err="";
  code=(code||setup.code||"").trim().toUpperCase(); setup.code=code;
  if(!code) return netErr("Entre le code de la partie.");
  try{ await fb(); }catch(e){ return netErr(FBERR); }
  let g;
  try{ g=(await gref(code).once("value")).val(); }catch(e){ return netErr("Lecture impossible. Vérifie les règles de sécurité (voir le guide)."); }
  if(!g) return netErr(`Aucune partie ne porte le code ${code}.`);
  if((g.seats||[]).some(x=>x.uid===NET.me)){ netEnter(code); return; }
  if(g.status!=="lobby") return netErr("Cette partie a déjà commencé sans toi.");
  if(silent){ setup.mode="online"; setup.onl="join"; showSetup(); return; }
  const name=(setup.names[0]||"").trim(); if(!name) return netErr("Indique ton nom.");
  const r=await gref(code).child("seats").transaction(seats=>{
    if(!seats) return seats;
    if(seats.some(x=>x.uid===NET.me)) return seats;
    const i=seats.findIndex(x=>x.type==="human"&&!x.uid); if(i<0) return;
    seats[i]={type:"human",lv:0,uid:NET.me,name}; return seats;
  });
  if(!r.committed || !(r.snapshot.val()||[]).some(x=>x.uid===NET.me)) return netErr("Cette partie est complète.");
  netEnter(code);
}
function netEnter(code){
  botGen++; clearTimeout(botTimer); botTimer=null; closeFinale(); endFx();
  Object.assign(NET,{on:true,code,ref:gref(code),v:0,lastPushed:null,pending:false,dirty:false,game:null});
  S=null; setup.err="";
  try{ localStorage.setItem("harmonies-online",code); }catch(e){}
  try{ history.replaceState(null,"",location.pathname+location.search+"#"+code); }catch(e){}
  const pr=NET.ref.child("presence/"+NET.me);
  NET.conn=firebase.database().ref(".info/connected");
  NET.conn.on("value",x=>{ if(x.val()){ pr.onDisconnect().remove(); pr.set(true); } });
  closeModal(); render();
  NET.ref.on("value",onGame);
}
function netLeave(){
  if(NET.ref){ NET.ref.off("value",onGame); NET.ref.child("presence/"+NET.me).remove().catch(()=>{}); }
  if(NET.conn) NET.conn.off();
  Object.assign(NET,{on:false,code:null,ref:null,conn:null,game:null,host:false,pending:false,dirty:false});
  try{ localStorage.removeItem("harmonies-online"); }catch(e){}
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  botGen++; clearTimeout(botTimer); botTimer=null; closeFinale(); endFx();
  S=null;
}
function onGame(snap){
  const g=snap.val();
  if(!NET.on) return;
  if(!g){ netLeave(); netErr("Cette partie n'existe plus."); return; }
  NET.game=g; NET.host=g.host===NET.me;
  if(g.status==="lobby"){ if(modal===null||modal==="lobby") showLobby(); return; }
  if(g.state && !NET.pending && !NET.dirty && g.state!==NET.lastPushed && (g.v||0)>=NET.v) applyRemote(g);
  else { NET.v=Math.max(NET.v,g.v||0); if(S) render(); }
}
function applyRemote(g){
  const prev=S, ns=JSON.parse(g.state);
  NET.v=g.v||0; NET.lastPushed=g.state;
  ns.view = prev && prev.cur===ns.cur && prev.view!=null && prev.view<ns.players.length ? prev.view : ns.cur;
  const wasTrig=prev?prev.endTriggered:true, wasOver=prev?prev.over:true;
  S=ns;
  if(modal==="lobby"||modal==="setup") closeModal();
  render();
  if(!wasTrig && S.endTriggered && !S.over) lastRoundFx(String(S.endReason||"").startsWith("Le sac"), S.players.length-S.cur);
  if(!wasOver && S.over) startFinale();
  maybeBot();
}
function netPush(){ NET.dirty=true; if(!NET.pending) netFlush(); }
function netFlush(){
  if(!NET.on||!S) { NET.dirty=false; return; }
  NET.dirty=false; NET.pending=true;
  const str=JSON.stringify(S), myV=NET.v; NET.lastPushed=str;
  NET.ref.transaction(g=>{ if(!g) return g; if((g.v||0)!==myV) return; g.v=myV+1; g.state=str; g.status="playing"; return g; })
  .then(r=>{
    NET.pending=false;
    if(r.committed){ NET.v=myV+1; if(NET.dirty) netFlush(); }
    else { NET.dirty=false; const g=r.snapshot&&r.snapshot.val(); if(g&&g.state){ NET.lastPushed=null; NET.v=0; applyRemote(g); } }
  }).catch(()=>{ NET.pending=false; NET.dirty=false; });
}
function showLobby(){
  const g=NET.game; if(!g) return; modal="lobby";
  const link=location.href.split("#")[0]+"#"+NET.code, seats=g.seats||[], pres=g.presence||{};
  const full=seats.every(x=>x.type==="bot"||x.uid);
  openModal(`<div><div class="label" style="margin-bottom:2px">Salle d'attente · face ${g.side}</div><div class="bigcode">${NET.code}</div></div>
   <p style="margin:0">Envoie ce lien à tes copains, ou donne-leur le code :</p>
   <div class="linkrow"><input id="olink" readonly value="${esc(link)}" aria-label="Lien de la partie"><button class="btn" data-a="ocopy">Copier</button></div>
   <div class="rank">${seats.map((x,i)=>`<div><span>${x.type==="bot"?`${esc(x.name)} <span class="tag">Bot ${LV[x.lv].toLowerCase()}</span>`: x.uid?`${esc(x.name||"Joueur")}${x.uid===NET.me?' <span class="tag">toi</span>':""}${x.uid===g.host?' <span class="tag">hôte</span>':""}${pres[x.uid]?"":' <span class="tag">hors ligne</span>'}`:`<span class="note" style="margin:0">Place libre, en attente d'un ami…</span>`}</span>${NET.host&&x.type==="human"&&!x.uid?`<button class="btn" data-a="obot" data-i="${i}">Mettre un bot</button>`:""}</div>`).join("")}</div>
   <p class="note" style="margin:0">${full?(NET.host?"Tout le monde est là, tu peux lancer la partie.":"Tout le monde est là. L'hôte va lancer la partie."):"La partie peut commencer quand toutes les places sont prises."}</p>
   <div class="tools">${NET.host?`<button class="btn primary" data-a="ostart" ${full?"":"disabled"}>Lancer la partie</button>`:""}<button class="btn" data-a="oleave">Quitter</button></div>`);
}
function netStart(){
  const g=NET.game; if(!NET.host||!g||g.status!=="lobby") return;
  const bak=JSON.stringify(setup), seats=g.seats;
  Object.assign(setup,{n:seats.length,side:g.side||"A",names:seats.map(x=>x.name),types:seats.map(x=>x.type),lv:seats.map(x=>x.lv||0),uids:seats.map(x=>x.uid||null)});
  newGame();
  Object.assign(setup,JSON.parse(bak)); delete setup.uids;
  NET.v=g.v||0; closeModal(); commit();
}

// ---------- Fenêtres ----------
function openModal(html){ document.getElementById("modal").innerHTML=`<div class="modal" data-a="bg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeModal(){ document.getElementById("modal").innerHTML=""; modal=null; maybeBot(); }
function showSetup(){
  modal="setup";
  const online=setup.mode==="online";
  const sideSeg=`<div class="field"><span class="label">Face du plateau</span><div class="seg"><button class="${setup.side==="A"?"on":""}" data-a="side" data-i="A">A · La rivière</button><button class="${setup.side==="B"?"on":""}" data-a="side" data-i="B">B · Les îles</button></div></div>`;
  let body, btn;
  if(!online){
    body=`<div class="field"><span class="label">Nombre de joueurs</span><div class="seg">${[1,2,3,4].map(n=>`<button class="${setup.n===n?"on":""}" data-a="sn" data-i="${n}">${n===1?"Solo":n}</button>`).join("")}</div></div>
   ${setup.names.slice(0,setup.n).map((n,i)=>`<div class="prow"><label class="field"><span class="label">Joueur ${i+1}</span><input id="pname${i}" value="${esc(n)}" maxlength="16"></label>
     <div class="seg"><button class="${setup.types[i]==="human"?"on":""}" data-a="ptype" data-i="${i}:human">Humain</button><button class="${setup.types[i]==="bot"?"on":""}" data-a="ptype" data-i="${i}:bot">Bot</button></div>
     ${setup.types[i]==="bot"?`<div class="seg">${LV.map((l,k)=>`<button class="${setup.lv[i]===k?"on":""}" data-a="plv" data-i="${i}:${k}">${l}</button>`).join("")}</div>`:""}</div>`).join("")}
   <p class="note" style="margin:0">Tous les joueurs humains jouent sur cet appareil, chacun son tour. Facile joue presque au hasard, Moyen pose chaque jeton au mieux, Difficile teste tous les ordres de pose et prépare ses habitats.</p>${sideSeg}`;
    btn=`<button class="btn primary" data-a="start">Commencer</button>`;
  } else if(!FB_OK){
    body=`<p class="note" style="margin:0">Le jeu en ligne n'est pas encore configuré : il faut renseigner le fichier <b>firebase-config.js</b> (voir le guide d'installation).</p>`; btn="";
  } else {
    const join=setup.onl==="join";
    body=`<div class="seg"><button class="${!join?"on":""}" data-a="sonl" data-i="create">Créer une partie</button><button class="${join?"on":""}" data-a="sonl" data-i="join">Rejoindre avec un code</button></div>
    <label class="field"><span class="label">Ton nom</span><input id="pname0" value="${esc(setup.names[0]||"")}" maxlength="16" autocomplete="nickname"></label>`+
    (join?`<label class="field"><span class="label">Code de la partie</span><input id="pcode" value="${esc(setup.code)}" maxlength="8" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:.15em;font-weight:700"></label>`
     :`<div class="field"><span class="label">Nombre de joueurs</span><div class="seg">${[2,3,4].map(n=>`<button class="${setup.on===n?"on":""}" data-a="osn" data-i="${n}">${n}</button>`).join("")}</div></div>
     ${Array.from({length:setup.on-1},(_,j)=>{ const i=j+1; return `<div class="prow"><span class="label" style="margin:0">Place ${i+1}</span><div class="seg"><button class="${setup.ot[i]==="human"?"on":""}" data-a="optype" data-i="${i}:human">Un ami</button><button class="${setup.ot[i]==="bot"?"on":""}" data-a="optype" data-i="${i}:bot">Bot</button></div>${setup.ot[i]==="bot"?`<div class="seg">${LV.map((l,k)=>`<button class="${setup.ol[i]===k?"on":""}" data-a="oplv" data-i="${i}:${k}">${l}</button>`).join("")}</div>`:""}</div>`; }).join("")}${sideSeg}`);
    btn= join?`<button class="btn primary" data-a="ojoin">Rejoindre</button>`:`<button class="btn primary" data-a="ocreate">Créer la partie</button>`;
  }
  let resume=""; try{ const c=localStorage.getItem("harmonies-online"); if(online&&FB_OK&&c&&!NET.on) resume=`<button class="btn" data-a="oresume" data-i="${esc(c)}">Reprendre la partie ${esc(c)}</button>`; }catch(e){}
  openModal(`<h2>Nouvelle partie</h2>
   <div class="seg"><button class="${!online?"on":""}" data-a="smode" data-i="local">Sur cet appareil</button><button class="${online?"on":""}" data-a="smode" data-i="online">En ligne</button></div>
   ${body}${setup.err?`<p class="note" style="color:var(--danger);margin:0;font-weight:600">${esc(setup.err)}</p>`:""}
   <div class="tools">${btn}${resume}${S&&!NET.on?`<button class="btn" data-a="close">Retour à la partie</button>`:""}</div>`);
}
function readNames(){ for(let i=0;i<4;i++){ const el=document.getElementById("pname"+i); if(el) setup.names[i]=el.value; } const c=document.getElementById("pcode"); if(c) setup.code=c.value.trim().toUpperCase(); }
const isDefaultName=(n,i)=>{ n=(n||"").trim(); return !n || n==="Joueur "+(i+1) || BOTNAME.includes(n); };
function setType(i,ty){ setup.types[i]=ty; if(isDefaultName(setup.names[i],i)) setup.names[i]= ty==="bot"?BOTNAME[setup.lv[i]]:"Joueur "+(i+1); }
function setLv(i,k){ setup.lv[i]=k; if(isDefaultName(setup.names[i],i)) setup.names[i]=BOTNAME[k]; }
function showRules(){
  modal="rules";
  openModal(`<h2>Règles</h2>
  <p>Construis ton paysage avec des jetons colorés et crée des habitats pour accueillir des animaux. Le plus de points gagne.</p>
  <h3>Ton tour</h3><ul>
   <li><b>Obligatoire :</b> prends un lot de 3 jetons dans l'offre et pose-les tous sur ton plateau.</li>
   <li><b>Facultatif, 1 fois :</b> prends une carte Animal (4 cartes en cours maximum).</li>
   <li><b>Facultatif, autant que tu veux :</b> installe un cube Animal quand ton paysage reproduit exactement le motif de la carte (rotation libre, hauteurs exactes).</li>
   <li>Les actions se font dans l'ordre que tu veux, même entre deux jetons.</li></ul>
  <h3>Empiler</h3><ul>
   <li>Toujours possible sur une case vide. Jamais sous un jeton, jamais sur un cube.</li>
   <li>Montagne : gris sur gris, jusqu'à 3. Arbre : vert sur 0, 1 ou 2 marrons. Bâtiment : rouge sur un marron, un gris ou un rouge.</li>
   <li>Bleu et jaune restent seuls : rien ne va dessus.</li></ul>
  <h3>Fin de partie</h3><p>Quand le sac ne peut plus remplir l'offre, ou qu'un joueur termine son tour avec 2 cases vides ou moins. On finit le tour de table, puis on compte. Égalité : le plus de cubes posés l'emporte.</p>
  <h3>Décompte</h3>
  <table class="rtab"><tr><td>Arbres</td><td>1 / 3 / 7 selon la hauteur 1, 2, 3 (un tronc sans feuillage vaut 0)</td></tr>
  <tr><td>Montagnes</td><td>1 / 3 / 7 selon la hauteur, seulement si elle touche une autre montagne</td></tr>
  <tr><td>Champs</td><td>5 par groupe d'au moins 2 jaunes adjacents, quelle que soit sa taille</td></tr>
  <tr><td>Bâtiments</td><td>5 si au moins 3 couleurs différentes l'entourent (jeton du dessus)</td></tr>
  <tr><td>Eau, face A</td><td>Ta plus longue rivière, mesurée par le plus court chemin : 2/5/8/11/15 pour 2 à 6 jetons, +4 par jeton au-delà</td></tr>
  <tr><td>Eau, face B</td><td>5 par île : chaque zone de cases séparée des autres par l'eau</td></tr>
  <tr><td>Animaux</td><td>Chaque carte vaut le dernier chiffre découvert (0 si aucun cube posé)</td></tr></table>
  <h3>Solo</h3><p>Offre de 3 lots et 3 cartes. En fin de tour, les jetons restants sont défaussés et l'offre est refaite. Si tu n'as pas pris de carte, tu peux en remplacer une.</p>
  <p class="note">Le contenu du jeu (120 jetons : 23 bleus, 23 gris, 21 marrons, 19 verts, 19 jaunes, 15 rouges) et le décompte suivent la règle officielle de Harmonies (Libellud). Les cartes Animal de cette version sont des motifs inventés.</p>
  <div class="tools"><button class="btn primary" data-a="close">Fermer</button></div>`);
}
function showEnd(){
  modal="end";
  const res=S.players.map(p=>({p,s:score(p,S.side)})).sort((a,b)=>b.s.total-a.s.total||b.p.cubes-a.p.cubes);
  openModal(`<h2>${S.players.length===1?"Ton score":esc(res[0].p.name)+" l'emporte"}</h2>
   ${S.endReason?`<p class="note" style="margin:0">Fin déclenchée : ${esc(S.endReason.charAt(0).toLowerCase()+S.endReason.slice(1))}.</p>`:""}
   <div class="rank">${res.map(r=>`<div><span>${esc(r.p.name)} <span class="note">· ${r.p.cubes} cubes</span></span><b>${r.s.total}</b></div>`).join("")}</div>
   <div class="tools"><button class="btn primary" data-a="new">Rejouer</button><button class="btn" data-a="close">Voir les plateaux</button></div>`);
}

// ---------- Événements ----------
document.addEventListener("click",e=>{
  const cellG=e.target.closest("[data-cell]"); if(cellG){ cellTap(+cellG.dataset.cell); return; }
  const el=e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a, i=el.dataset.i;
  if(a==="bg"){ if(modal==="lobby") return; if(e.target===el && modal!=="setup") closeModal(); else if(e.target===el && S) closeModal(); return; }
  if(el.disabled) return;
  switch(a){
    case "pick": pick(+i); break;
    case "take": takeCard(+i); break;
    case "csel": selCard(+i); break;
    case "hsel": S.turn.sel=+i; S.turn.selCard=null; render(); break;
    case "discard": discardTok(); break;
    case "swap": S.turn.swapMode=!S.turn.swapMode; render(); break;
    case "end": endTurn(); break;
    case "undo": undoTurn(); break;
    case "view": S.view=+i; render(); break;
    case "fxclose": endFx(); break;
    case "rules": showRules(); break;
    case "detail": if(S.over) showDetail(); break;
    case "new": if(NET.on){ if(S&&!S.over&&!confirm("Quitter la partie en ligne ? Tu pourras la reprendre avec son code.")) break; netLeave(); } closeFinale(); setup.err=""; showSetup(); break;
    case "smode": readNames(); setup.mode=i; setup.err=""; showSetup(); break;
    case "sonl": readNames(); setup.onl=i; setup.err=""; showSetup(); break;
    case "osn": readNames(); setup.on=+i; showSetup(); break;
    case "optype": { readNames(); const [k,ty]=i.split(":"); setup.ot[+k]=ty; showSetup(); break; }
    case "oplv": { readNames(); const [k,l]=i.split(":"); setup.ol[+k]=+l; showSetup(); break; }
    case "ocreate": el.disabled=true; netCreate(); break;
    case "ojoin": el.disabled=true; netJoin(); break;
    case "oresume": netJoin(i,true); break;
    case "ocopy": { const inp=document.getElementById("olink"); const done=()=>{ el.textContent="Copié"; }; try{ navigator.clipboard.writeText(inp.value).then(done,()=>inp.select()); }catch(err){ inp.select(); } break; }
    case "obot": if(NET.host) NET.ref.child("seats/"+i).set({type:"bot",lv:1,uid:"",name:BOTNAME[1]+" "+(+i+1)}); break;
    case "ostart": netStart(); break;
    case "oleave": netLeave(); setup.err=""; showSetup(); break;
    case "otakeover": if(NET.on&&NET.host&&S&&!S.over&&!isBot(P())){ P().bot=1; commit(); } break;
    case "fskip": if(fin){ fin.skip=true; finishFinale(); } break;
    case "fclose": closeFinale(); render(); break;
    case "fdetail": S.view=+i; showDetail(); break;
    case "finale": closeModal(); startFinale(); break;
    case "close": closeModal(); break;
    case "sn": readNames(); setup.n=+i; showSetup(); break;
    case "side": readNames(); setup.side=i; showSetup(); break;
    case "ptype": { readNames(); const [k,ty]=i.split(":"); setType(+k,ty); showSetup(); break; }
    case "plv": { readNames(); const [k,l]=i.split(":"); setLv(+k,+l); showSetup(); break; }
    case "start": readNames(); botGen++; clearTimeout(botTimer); botTimer=null; newGame(); closeModal(); commit(); break;
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && modal && modal!=="lobby" && (modal!=="setup"||S)) closeModal(); });

const HASH=(location.hash||"").slice(1).toUpperCase();
if(HASH && FB_OK){ setup.mode="online"; setup.onl="join"; setup.code=HASH; S=null; render(); showSetup(); netJoin(HASH,true); }
else { S=load(); }
if(S && !S.turn) S=null;
if(S && isBot(S.players[S.cur]) && S.snap && S.turn.picked!==null){ const snap=S.snap; S=JSON.parse(snap); S.snap=snap; }
if(!NET.on && !(HASH && FB_OK)) render();
maybeBot();
})();
</script>
